<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Diagnóstico y Clasificación PYME | TFG ADE</title>
  <style>
    :root {
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --bg-page: #f8f9fa;
      --bg-card: #ffffff;
      --border-color: #e5e7eb;
      --text-main: #111827;
      --text-muted: #4b5563;
      --blue-main: #2563eb;
      --blue-bg: #eff6ff;
      --green-main: #16a34a;
      --green-bg: #f0fdf4;
      --red-main: #dc2626;
      --red-bg: #fef2f2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 30px 16px;
    }

    .container {
      max-width: 680px;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .header-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: #f3f4f6;
      color: var(--text-muted);
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    p.subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .variables-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .var-card {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      background: #fafafa;
    }

    .var-name {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .var-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 10px;
      height: 28px;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .btn-val {
      flex: 1;
      padding: 6px 0;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: #ffffff;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-val:hover {
      background: #f3f4f6;
    }

    .btn-val.active {
      background: var(--blue-main);
      color: #ffffff;
      border-color: var(--blue-main);
    }

    .dynamic-box {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      background: #ffffff;
      margin-bottom: 16px;
    }

    .dynamic-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .btn-choice {
      flex: 1;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: #ffffff;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-choice:hover {
      background: #f3f4f6;
    }

    .btn-choice.active {
      background: var(--blue-main);
      color: #ffffff;
      border-color: var(--blue-main);
    }

    .result-box {
      border-radius: 8px;
      padding: 18px;
      border-left: 4px solid var(--text-muted);
      background: #f9fafb;
      margin-top: 20px;
    }

    .result-box.danger {
      border-left-color: var(--red-main);
      background: var(--red-bg);
    }

    .result-box.success {
      border-left-color: var(--green-main);
      background: var(--green-bg);
    }

    .result-box.info {
      border-left-color: var(--blue-main);
      background: var(--blue-bg);
    }

    .result-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .result-box.danger .result-title { color: var(--red-main); }
    .result-box.success .result-title { color: var(--green-main); }
    .result-box.info .result-title { color: var(--blue-main); }

    .result-desc {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-main);
    }

    .score-badge {
      display: inline-block;
      margin-top: 8px;
      font-family: monospace;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(0,0,0,0.06);
    }

    .footer {
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px dashed var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
    }

    .btn-reset {
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      color: var(--text-muted);
    }

    .btn-reset:hover {
      background: #f3f4f6;
      color: var(--text-main);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-tag">TFG ADE · Anexo Digital</div>
  <h1>Simulador de Diagnóstico y Clasificación PYME</h1>
  <p class="subtitle">Herramienta interactiva para determinar el escenario de viabilidad y madurez tecnológica según las variables DIG, PRE y ORG.</p>

  <div class="section-title">1. Entrada de datos de la PYME (T0)</div>
  <div class="variables-grid" id="selectors"></div>

  <div id="dynamic-area"></div>
  <div id="result-area"></div>

  <div class="footer">
    <span>Trabajo de Fin de Grado · UPV</span>
    <button class="btn-reset" onclick="resetAll()">Restablecer valores</button>
  </div>
</div>

<script>
  const vars = { DIG: 2, PRE: 2, ORG: 2 };
  let interventionOutcome = null;
  let orgStillLow = null;
  let manualScenario = null;

  function renderSelectors() {
    const config = [
      { key: 'DIG', name: 'DIG', desc: 'Digitalización' },
      { key: 'PRE', name: 'PRE', desc: 'Presupuesto' },
      { key: 'ORG', name: 'ORG', desc: 'Modelo Organizativo' }
    ];

    document.getElementById('selectors').innerHTML = config.map(c => `
      <div class="var-card">
        <div class="var-name">${c.name}</div>
        <div class="var-desc">${c.desc}</div>
        <div class="btn-group">
          ${[1, 2, 3].map(v => `
            <button class="btn-val ${vars[c.key] === v ? 'active' : ''}" onclick="setVar('${c.key}', ${v})">
              ${v}
            </button>
          `).join('')}
        </div>
      </div>
    `).join('');
  }

  function setVar(k, v) {
    vars[k] = v;
    interventionOutcome = null;
    orgStillLow = null;
    manualScenario = null;
    updateAll();
  }

  function resetAll() {
    vars.DIG = 2; vars.PRE = 2; vars.ORG = 2;
    interventionOutcome = null;
    orgStillLow = null;
    manualScenario = null;
    updateAll();
  }

  function getLowCount() {
    return [vars.DIG, vars.PRE, vars.ORG].filter(v => v === 1).length;
  }

  function calcScore() {
    return (0.30 * vars.DIG + 0.30 * vars.PRE + 0.40 * vars.ORG);
  }

  function updateAll() {
    renderSelectors();
    renderDynamicQuestions();
    renderResult();
  }

  function renderDynamicQuestions() {
    const lc = getLowCount();
    let html = '';

    if (lc === 1 || lc === 2) {
      html += `
        <div class="dynamic-box">
          <div class="dynamic-title">Intervención Fase 0: ¿Las variables en nivel Bajo logran subir a ≥ 2?</div>
          <div class="btn-group">
            <button class="btn-choice ${interventionOutcome === 'exito' ? 'active' : ''}" onclick="setOutcome('exito')">
              Éxito (todas suben a ≥ 2)
            </button>
            <button class="btn-choice ${interventionOutcome === 'persiste' ? 'active' : ''}" onclick="setOutcome('persiste')">
              Persistencia (quedan 1 o 2 bajas)
            </button>
          </div>
        </div>
      `;

      if (interventionOutcome === 'persiste') {
        html += `
          <div class="dynamic-box">
            <div class="dynamic-title">Evaluación de persistencia: ¿La variable organizativa sigue en nivel bajo (ORG = 1)?</div>
            <div class="btn-group">
              <button class="btn-choice ${orgStillLow === true ? 'active' : ''}" onclick="setOrgLow(true)">
                Sí (persiste ORG = 1)
              </button>
              <button class="btn-choice ${orgStillLow === false ? 'active' : ''}" onclick="setOrgLow(false)">
                No (ORG ≥ 2, baja solo en DIG o PRE)
              </button>
            </div>
          </div>
        `;
      }
    }

    document.getElementById('dynamic-area').innerHTML = html;
  }

  function setOutcome(val) {
    interventionOutcome = val;
    orgStillLow = null;
    updateAll();
  }

  function setOrgLow(val) {
    orgStillLow = val;
    updateAll();
  }

  function renderResult() {
    const lc = getLowCount();
    const score = calcScore();
    const scoreFormatted = score.toFixed(2);
    const container = document.getElementById('result-area');

    if (lc === 3) {
      container.innerHTML = `
        <div class="result-box danger">
          <div class="result-title">VETO ABSOLUTO — Inviabilidad del Proyecto</div>
          <div class="result-desc">
            Las 3 dimensiones (DIG, PRE, ORG) se sitúan en nivel 1 (Bajo). El proyecto carece de las bases mínimas para una implantación viable de soluciones CRM.
          </div>
        </div>
      `;
      return;
    }

    if (lc === 1 || lc === 2) {
      if (!interventionOutcome) {
        container.innerHTML = `
          <div class="result-box info">
            <div class="result-title">ESCENARIO A — Diagnóstico Vulnerable Inicial (T0)</div>
            <div class="result-desc">
              Se detectan ${lc} variable(s) en nivel 1 (Bajo). Se requiere ejecutar una <b>Intervención en Fase 0</b> con el objetivo de nivelar los factores críticos antes de la implantación.
            </div>
          </div>
        `;
        return;
      }

      if (interventionOutcome === 'persiste') {
        if (orgStillLow === true) {
          container.innerHTML = `
            <div class="result-box danger">
              <div class="result-title">VETO ABSOLUTO — Inviabilidad Organizativa</div>
              <div class="result-desc">
                Persiste la deficiencia en el modelo organizativo (ORG = 1). Sin alineación humana y de procesos, el riesgo de rechazo operativo invalida el despliegue del CRM.
              </div>
            </div>
          `;
          return;
        }

        if (orgStillLow === false) {
          container.innerHTML = `
            <div class="result-box success">
              <div class="result-title">CRM ADAPTATIVO — Despliegue Modular</div>
              <div class="result-desc">
                La organización está preparada (ORG ≥ 2), permitiendo absorber soluciones escalables o adaptadas a las restricciones presupuestarias o digitales residuales.
              </div>
            </div>
          `;
          return;
        }

        container.innerHTML = `
          <div class="result-box info">
            <div class="result-title">Evaluando persistencia...</div>
            <div class="result-desc">Por favor, indique si la dimensión organizativa (ORG) permanece en nivel 1.</div>
          </div>
        `;
        return;
      }
    }

    let scenarioText = '';
    let scenarioClass = 'info';

    if (score >= 2.40) {
      scenarioText = 'ESCENARIO C — Optimización Tecnológica (S ≥ 2,40)';
      scenarioClass = 'success';
    } else {
      scenarioText = 'ESCENARIO B — Digitalización en Proceso (1,70 ≤ S ≤ 2,39)';
      scenarioClass = 'info';
    }

    container.innerHTML = `
      <div class="result-box ${scenarioClass}">
        <div class="result-title">${scenarioText}</div>
        <div class="result-desc">
          Evaluación favorable de madurez tecnológica. La empresa dispone de los fundamentos requeridos para iniciar la transición y adopción del sistema CRM.
        </div>
        <div class="score-badge">Puntuación Híbrida: S = 0.30·DIG + 0.30·PRE + 0.40·ORG = ${scoreFormatted}</div>
      </div>
    `;
  }

  updateAll();
</script>

</body>
</html>
